<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div data-tauri-drag-region id="titlebar">
      <button id="minimize">
        <svg xmlns="http://w3.org" viewBox="0 0 46 32" width="20" height="32">
          <line
            x1="15"
            y1="16"
            x2="31"
            y2="16"
            stroke="var(--minimize-button-color)"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button id="snap-btn">
        <svg
          viewBox="0 0 32 32"
          width="12"
          height="32"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient
              id="outlineGradient"
              gradientUnits="userSpaceOnUse"
              x1="4"
              y1="28"
              x2="28"
              y2="4"
            >
              <stop offset="20%" stop-color="var(--gradient-start, #24c8db)" />
              <stop offset="80%" stop-color="var(--gradient-end, #ffc131)" />
            </linearGradient>
          </defs>

          <rect
            x="4"
            y="4"
            width="24"
            height="24"
            rx="3"
            fill="none"
            stroke="url(#outlineGradient)"
            stroke-width="5"
          />
        </svg>
      </button>
      <button id="close">
        <svg xmlns="http://w3.org" viewBox="0 0 46 32" width="26" height="32">
          <line
            x1="17"
            y1="11"
            x2="29"
            y2="23"
            stroke="var(--close-button-color)"
            stroke-width="4"
            stroke-linecap="round"
          />
          <line
            x1="29"
            y1="11"
            x2="17"
            y2="23"
            stroke="var(--close-button-color)"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    <main class="container">
      <h1>Welcome to Tauri</h1>

      <div class="row">
        <a href="https://vite.dev" target="_blank">
          <img src="/src/assets/vite.svg" class="logo vite" alt="Vite logo" />
        </a>
        <a href="https://tauri.app" target="_blank">
          <img
            src="/src/assets/tauri.svg"
            class="logo tauri"
            alt="Tauri logo"
          />
        </a>
        <a href="https://www.typescriptlang.org/docs" target="_blank">
          <img
            src="/src/assets/typescript.svg"
            class="logo typescript"
            alt="typescript logo"
          />
        </a>
      </div>
      <p>Click on the Tauri logo to learn more about the framework</p>

      <form class="row" id="greet-form">
        <button id="snap-switch-button">Switch Snap Area</button>
      </form>
      <p id="greet-msg"></p>

      <div style="display: flex; justify-content: center">
        <button id="create-window-button" style="width: fit-content">
          Create New Window
        </button>
        <button id="toggle-snap" style="width: fit-content">Toggle Snap</button>
      </div>
    </main>
  </body>
</html>
