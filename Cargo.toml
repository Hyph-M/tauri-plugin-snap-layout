[package]
name = "tauri-plugin-snap-layout"
version = "1.0.2"
authors = ["Hyph-M", "Siddharth <siddharth99c@gmail.com>", "clarifei" ]
description = "Snap Layout feature for Windows 11 frameless functionality."
keywords = ["tauri", "windows", "snap", "plugin", "frameless"]
categories = ["gui"]
readme = "README.md"
edition = "2021"
rust-version = "1.70"
exclude = ["/example", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-snap-layout"
license = "MIT"
homepage = "https://github.com/Hyph-M/tauri-plugin-snap-layout"
repository = "https://github.com/Hyph-M/tauri-plugin-snap-layout"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
